name: FII/DII retry

# NSE posts the cash FII/DII figure after close and the exact minute moves,
# so this watches for it from 19:00 IST and checks every ten minutes until it
# lands. Each tick is cheap: --ensure-fii reads history first and exits having
# touched nothing once the number is in, and when it is not it fetches only
# the FII/DII source - two HTTP calls - rather than all fifteen. Nothing is
# written unless the figure actually arrives, so a quiet evening produces no
# commits at all.
#
# GitHub's scheduler is best-effort: under load a tick can slip by several
# minutes, so treat ten minutes as the target interval, not a guarantee.
on:
  schedule:
    # 13:30-13:50 UTC = 19:00-19:20 IST, then every ten minutes to 23:20 IST.
    - cron: "30,40,50 13 * * 1-5"
    - cron: "*/10 14-17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Never let a retry and the main run commit over each other.
  group: markets-data
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch FII/DII only if it is still missing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch.py --ensure-fii
      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/ipo_listings.json \
                  docs/china_yields.json docs/india_curve.json docs/ipo_circulars.json
          if git diff --staged --quiet; then
            echo "No change - FII/DII was already present."
          else
            git commit -m "data: fii retry $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
