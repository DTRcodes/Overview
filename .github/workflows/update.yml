name: Update market data

on:
  schedule:
    # 13:30 UTC = 19:00 IST, after the FII/DII figure posts for the day.
    # GitHub's scheduler is best-effort and can run late under load; the
    # dashboard shows its own "last updated" stamp, so a slipped run is
    # visible rather than silent.
    # 02:30 UTC = 08:00 IST - the pre-market read: IPO pipeline with expected
    # listing dates, plus yesterday's FII/DII and closing valuations.
    - cron: "30 2 * * 1-5"
    # 13:30 UTC = 19:00 IST - after close, once the day's own data has landed.
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}          # lets you trigger a run by hand

permissions:
  contents: write

concurrency:
  # Shared with fii-retry.yml: two workflows now commit to this repo and
  # must never overlap.
  group: markets-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        env:
          # Optional. Without it, US rates fall back to Yahoo and the India
          # yield tile has no fallback when investing.com blocks the runner.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/ipo_listings.json docs/china_yields.json docs/india_curve.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
