# Refreshes the NIFTY 50 allocation board's data from NSE.
#
# Runs every 5 minutes in market hours. The snapshot (nifty50.json, ~22 KB) is written
# every run; the intraday file (~133 KB) only on the quarter hours and once after the
# close, because committing it every 5 minutes is 75 commits a day of mostly unchanged
# minute points. GitHub's scheduler is best-effort and can arrive 5-15 minutes late.
name: nifty-feed
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"     # 08:30-16:25 IST, weekdays (cron is UTC)
    - cron: "45 10 * * 1-5"        # 16:15 IST: settles the day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with update.yml and fii-retry.yml. Three workflows commit to this repo and
  # must never overlap - without this they race and a push is silently dropped.
  group: markets-data
  cancel-in-progress: false

jobs:
  nifty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pypdf

      - name: Decide whether this run also writes the intraday file
        id: when
        run: |
          MIN=$(date -u +%M)
          if [ $((10#$MIN % 15)) -eq 0 ] || [ "$(date -u +%H:%M)" = "10:45" ]; then
            echo "intraday=--intraday" >> "$GITHUB_OUTPUT"
          else
            echo "intraday=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch
        run: python nifty/nifty_feed.py once --out docs/data ${{ steps.when.outputs.intraday }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data nifty/cache
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data: nifty $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
