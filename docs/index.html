<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<title>Markets Board</title>
<style>
:root{
  color-scheme:light;
  --surface-0:#f3f2ef;      /* page ground, warm grey */
  --surface-1:#fcfcfb;      /* card + chart surface */
  --surface-2:#f0efec;      /* recessed wells */
  --line:#e2e0da;
  --grid:#eceae5;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#86847d;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --series-3:#1baf7a;
  --series-4:#8b5cf6;
  --series-5:#c026a3;
  --series-6:#b08900;
  --up:#1baf7a;
  --down:#e34948;
  --warn:#a8620a;
  --warn-bg:#faf1e2;
  --radius:13px;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-0:#121211;
    --surface-1:#1a1a19;
    --surface-2:#232322;
    --line:#2e2e2b;
    --grid:#282825;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#8b8a81;
    --series-1:#3987e5;
    --series-2:#d95926;
    --series-3:#199e70;
    --series-4:#a78bfa;
    --series-5:#e05fc4;
    --series-6:#d4a72c;
    --up:#199e70;
    --down:#e66767;
    --warn:#e0a458;
    --warn-bg:#2a2216;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--surface-0);color:var(--text-primary);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 44px env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 13px}
@media(min-width:720px){.wrap{padding:0 18px}}

header{padding:20px 0 12px}
h1{font-size:19px;margin:0 0 3px;letter-spacing:-.015em;font-weight:660}
.sub{color:var(--text-muted);font-size:12.5px}
.sub b{color:var(--text-secondary);font-weight:600}
#stamp{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

/* ---- stat tiles: the headline numbers, no plot ---- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:13px}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 12px 12px}
.stat .t{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .n{font-size:23px;font-weight:670;letter-spacing:-.025em;margin-top:3px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat .m{font-size:11px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ---- cards ---- */
.grid{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px 13px;min-width:0}
.card.wide{grid-column:1/-1}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);
  margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:640}
.cap{font-size:11.5px;color:var(--text-muted);margin:0 0 10px}
.badge{font-size:9.5px;padding:2px 6px;border-radius:20px;text-transform:none;
  letter-spacing:0;font-weight:600;background:var(--warn-bg);color:var(--warn);
  border:1px solid currentColor}

/* ---- filters ---- */
.filters{display:flex;gap:6px;align-items:center;margin:0 0 13px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--text-secondary);
  font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;
  min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-primary);
  box-shadow:0 1px 2px rgba(0,0,0,.09)}

/* ---- chart ---- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.serieslabel{font-size:11px;font-weight:640;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin:9px 0 0;font-size:11.5px;
  color:var(--text-secondary)}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);
  border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.13);opacity:0;transition:opacity .1s;z-index:5;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.tip .d{color:var(--text-muted);font-size:10.5px;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:11px}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.empty{color:var(--text-muted);font-size:12px;padding:22px 0;text-align:center}

/* ---- tables ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:330px}
th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--text-muted);font-weight:640;font-size:10px;text-transform:uppercase;
  letter-spacing:.05em}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:145px}
td{font-variant-numeric:tabular-nums;color:var(--text-secondary)}
td:first-child{color:var(--text-primary)}
.note{color:var(--text-muted);font-size:11px;margin-top:9px;line-height:1.45}
.err{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  border-radius:9px;padding:9px 11px;font-size:12px}
.foot{color:var(--text-muted);font-size:11.5px;padding:20px 0 0}
/* IPO pipeline row states. The left rule carries the same information as the
   tint, so the table still reads correctly in greyscale or for a red-green /
   blue-green colour deficiency. Tint goes on the td, not the tr: a tr
   background sits behind the cells and is invisible here. */
tr.lists-today td { background: color-mix(in srgb, var(--up) 15%, transparent); }
tr.lists-today td:first-child { box-shadow: inset 3px 0 0 var(--up); }
tr.awaiting td { background: color-mix(in srgb, var(--series-1) 14%, transparent); }
tr.awaiting td:first-child { box-shadow: inset 3px 0 0 var(--series-1); }
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;
  font-weight:600;border:1px solid var(--line);color:var(--text-muted)}
.pill.today{background:color-mix(in srgb,var(--up) 20%,transparent);
  border-color:var(--up);color:var(--up)}
.pill.soon{background:color-mix(in srgb,var(--series-1) 20%,transparent);
  border-color:var(--series-1);color:var(--series-1)}
.tvbox{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.tvbox code{flex:1 1 240px;min-width:0;overflow-x:auto;white-space:nowrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:6px 9px;font-size:11.5px;color:var(--text-secondary)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text-primary);border-radius:6px;padding:6px 11px;font-size:11.5px;
  font-weight:600;font-family:inherit}
.btn:hover{border-color:var(--text-muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Markets Board</h1>
    <div class="sub">Updated <b id="stamp">…</b> · <span id="srcs"></span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="seg" id="range" role="group" aria-label="Time range">
      <button data-d="30">1M</button>
      <button data-d="90">3M</button>
      <button data-d="180" aria-pressed="true">6M</button>
      <button data-d="0">All</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="viewChart" aria-pressed="true">Charts</button>
      <button id="viewTable" aria-pressed="false">Table</button>
    </div>
  </div>

  <div class="grid" id="board"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ------------------------------------------------------------------ utils */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? '–'
  : Number(v).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function ago(iso){
  if(!iso) return 'never';
  const s = (Date.now() - new Date(iso)) / 1000;
  if(s < 90) return 'just now';
  if(s < 5400) return Math.round(s/60) + ' min ago';
  if(s < 172800) return Math.round(s/3600) + ' h ago';
  return Math.round(s/86400) + ' d ago';
}
const shortDate = d => new Date(d + 'T00:00:00')
  .toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

let DATA = null, HIST = [], RANGE = 180, VIEW = 'chart';

/* --------------------------------------------------- monotone cubic path
   Fritsch–Carlson: smooth, but it cannot overshoot between points. A plain
   Catmull-Rom would invent highs and lows the market never printed, which on
   a P/E or a yield series is a lie, not a style choice.                     */
function smoothPath(pts){
  const n = pts.length;
  if(n === 0) return '';
  if(n === 1) return `M${pts[0].x},${pts[0].y}`;
  if(n === 2) return `M${pts[0].x},${pts[0].y}L${pts[1].x},${pts[1].y}`;
  const dx = [], dy = [], m = [];
  for(let i = 0; i < n - 1; i++){
    dx[i] = pts[i+1].x - pts[i].x;
    dy[i] = pts[i+1].y - pts[i].y;
    m[i]  = dx[i] === 0 ? 0 : dy[i] / dx[i];
  }
  const t = [m[0]];
  for(let i = 1; i < n - 1; i++){
    if(m[i-1] * m[i] <= 0) t[i] = 0;
    else {
      const w1 = 2*dx[i] + dx[i-1], w2 = dx[i] + 2*dx[i-1];
      t[i] = (w1 + w2) / (w1/m[i-1] + w2/m[i]);
    }
  }
  t[n-1] = m[n-2];
  let d = `M${pts[0].x},${pts[0].y}`;
  for(let i = 0; i < n - 1; i++){
    const h = dx[i];
    d += `C${pts[i].x + h/3},${pts[i].y + t[i]*h/3} `
       + `${pts[i+1].x - h/3},${pts[i+1].y - t[i+1]*h/3} `
       + `${pts[i+1].x},${pts[i+1].y}`;
  }
  return d;
}

/* --------------------------------------------------------------- charting */
function rangedRows(minDays){
  const rows = HIST.filter(r => r.date);
  if(!RANGE) return rows;              // "All" always wins
  const span = Math.max(RANGE, minDays || 0);
  const cut = Date.now() - span * 86400000;
  return rows.filter(r => new Date(r.date + 'T00:00:00') >= cut);
}

/* series: [{key, label, color, fmt}] — one axis only, always. Two measures of
   different scale get two charts, never a second y-axis. */
function lineChart(el, series, opts = {}){
  const rows = rangedRows(opts.minDays).filter(r => series.some(s => r[s.key] != null));
  if(rows.length < 2){
    el.innerHTML = `<div class="empty">Not enough history yet — the nightly run
      appends one row a day.</div>`;
    return;
  }
  const W = Math.max(el.clientWidth || 320, 260);
  const H = opts.height || 190;
  // A second axis is a deliberate exception, not the norm: it is only for a
  // faded context line (the index behind the P/E), never for two series the
  // reader is meant to compare directly.
  const ctx = opts.context || null;
  const padL = ctx ? 44 : 6, padR = 46, padT = 12, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;

  let lo = Infinity, hi = -Infinity;
  series.forEach(s => rows.forEach(r => {
    const v = r[s.key];
    if(v != null){ lo = Math.min(lo, v); hi = Math.max(hi, v); }
  }));
  if(!isFinite(lo)){ el.innerHTML = `<div class="empty">No data.</div>`; return; }
  if(opts.zeroLine){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const span = (hi - lo) || Math.abs(hi) || 1;
  lo -= span * 0.12; hi += span * 0.12;

  // Time-scaled x, not index-scaled. History mixes 27 years of weekly points
  // with six months of daily ones, and market holidays leave gaps; spacing
  // rows evenly would misdraw both.
  const tof = r => new Date(r.date + 'T00:00:00').getTime();
  const t0 = tof(rows[0]), t1 = tof(rows[rows.length - 1]);
  const X = r => padL + (t1 === t0 ? iw/2 : ((tof(r) - t0) / (t1 - t0)) * iw);
  const Y = v => padT + ih - ((v - lo) / (hi - lo)) * ih;

  const ticks = 4, gridlines = [], labels = [];
  for(let i = 0; i <= ticks; i++){
    const v = lo + (hi - lo) * (i / ticks), y = Y(v);
    gridlines.push(`<line class="gridline" x1="${padL}" y1="${y.toFixed(1)}"
      x2="${padL+iw}" y2="${y.toFixed(1)}"/>`);
    labels.push(`<text class="axis" x="${ctx ? padL-7 : padL+iw+7}"
      y="${(y+3.5).toFixed(1)}" text-anchor="${ctx ? 'end' : 'start'}">${
      nf(v, opts.dp ?? 1)}</text>`);
  }

  // ---- context series: its own scale, drawn behind, dashed and faded
  let ctxPath = '', ctxLo = 0, ctxHi = 1, ctxY = v => v;
  if(ctx){
    const cv = rows.map(r => r[ctx.key]).filter(v => v != null);
    if(cv.length > 1){
      ctxLo = Math.min(...cv); ctxHi = Math.max(...cv);
      const cs = (ctxHi - ctxLo) || Math.abs(ctxHi) || 1;
      ctxLo -= cs * 0.12; ctxHi += cs * 0.12;
      ctxY = v => padT + ih - ((v - ctxLo) / (ctxHi - ctxLo)) * ih;
      const cpts = rows.map(r => r[ctx.key] == null ? null
                    : {x:X(r), y:ctxY(r[ctx.key])}).filter(Boolean);
      ctxPath =
        `<path d="${smoothPath(cpts)}" fill="none" stroke="${ctx.color}"
           stroke-width="1.6" stroke-dasharray="5 4" opacity=".42"
           stroke-linecap="round" stroke-linejoin="round"/>`;
      for(let i = 0; i <= ticks; i++){
        const v = ctxLo + (ctxHi - ctxLo) * (i / ticks);
        labels.push(`<text class="axis" x="${padL+iw+7}"
          y="${(ctxY(v)+3.5).toFixed(1)}" opacity=".6" fill="${ctx.color}">${
          nf(v, ctx.dp ?? 0)}</text>`);
      }
    }
  }
  if(opts.zeroLine && lo < 0 && hi > 0){
    gridlines.push(`<line x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${padL+iw}"
      y2="${Y(0).toFixed(1)}" stroke="${cssv('--text-muted')}" stroke-width="1"
      stroke-dasharray="2 3" opacity=".65"/>`);
  }

  const spanDays = (t1 - t0) / 86400000;
  const fmtX = d => spanDays > 900
    ? new Date(d + 'T00:00:00').getFullYear()
    : spanDays > 200
      ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {month:'short', year:'2-digit'})
      : shortDate(d);
  const xlabels = [0, Math.floor((rows.length-1)/2), rows.length-1]
    .filter((v,i,a) => a.indexOf(v) === i)
    .map(i => `<text class="axis" x="${X(rows[i]).toFixed(1)}" y="${H-5}"
       text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${
       esc(fmtX(rows[i].date))}</text>`).join('');

  const paths = series.map((s, si) => {
    const pts = rows.map(r => r[s.key] == null ? null : {x:X(r), y:Y(r[s.key])})
                    .filter(Boolean);
    if(!pts.length) return '';
    const d = smoothPath(pts);
    const last = pts[pts.length-1];
    const lastV = [...rows].reverse().find(r => r[s.key] != null)[s.key];
    const gid = `g${si}_${Math.random().toString(36).slice(2,7)}`;
    // Area wash only when a single series owns the plot; with two it muddies.
    const area = series.length === 1
      ? `<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
           <stop offset="0%" stop-color="${s.color}" stop-opacity=".17"/>
           <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
         </linearGradient></defs>
         <path d="${d}L${last.x},${padT+ih}L${pts[0].x},${padT+ih}Z" fill="url(#${gid})"/>`
      : '';
    return area
      + `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"/>`
      + `<circle cx="${last.x}" cy="${last.y}" r="3.4" fill="${s.color}"
           stroke="${cssv('--surface-1')}" stroke-width="2"/>`
      // direct label — identity is never carried by colour alone
      + `<text class="serieslabel" x="${last.x-6}" y="${last.y-9}"
           text-anchor="end" fill="${s.color}">${nf(lastV, opts.dp ?? 2)}</text>`;
  }).join('');

  el.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img"
       aria-label="${esc(series.map(s=>s.label).join(' and '))} over time">
       ${gridlines.join('')}${ctxPath}${xlabels}${labels.join('')}${paths}
       <g id="cross" style="opacity:0">
         <line y1="${padT}" y2="${padT+ih}" stroke="${cssv('--text-muted')}"
           stroke-width="1" stroke-dasharray="3 3"/>
       </g>
       <rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>
     </svg>
     <div class="tip"></div>` +
    ((series.length > 1 || ctx)
      ? `<div class="legend">${series.map(s =>
          `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')
        + (ctx ? `<span><i style="background:${ctx.color};opacity:.45"></i>${
             esc(ctx.label)} <span style="color:var(--text-muted)">(right axis)</span></span>` : '')
        }</div>`
      : '');

  // ---- hover layer: crosshair + shared tooltip
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const cross = el.querySelector('#cross');
  const move = ev => {
    const pt = ev.touches ? ev.touches[0] : ev;
    const box = svg.getBoundingClientRect();
    const px = ((pt.clientX - box.left) / box.width) * W;
    // nearest row by actual plotted position, since x is time-scaled
    let r = rows[0], best = Infinity;
    for(const row of rows){
      const dpx = Math.abs(X(row) - px);
      if(dpx < best){ best = dpx; r = row; }
    }
    cross.style.opacity = 1;
    cross.querySelector('line').setAttribute('x1', X(r));
    cross.querySelector('line').setAttribute('x2', X(r));
    tip.innerHTML = `<div class="d">${esc(new Date(r.date+'T00:00:00')
        .toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}))}</div>` +
      series.map(s => `<div class="r"><span><i style="background:${s.color}"></i>${
        esc(s.label)}</span><b>${nf(r[s.key], opts.dp ?? 2)}</b></div>`).join('');
    tip.style.opacity = 1;
    const rel = (X(r) / W) * box.width;
    tip.style.left = Math.min(Math.max(rel - 52, 0), box.width - 128) + 'px';
    tip.style.top = '4px';
  };
  const leave = () => { tip.style.opacity = 0; cross.style.opacity = 0; };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', leave);
  svg.addEventListener('touchstart', move, {passive:true});
  svg.addEventListener('touchmove', move, {passive:true});
  svg.addEventListener('touchend', leave);
}

/* -------------------------------------------------------------- rendering */
function statTile(t, n, meta, cls){
  return `<div class="stat"><div class="t">${esc(t)}</div>
    <div class="n ${cls||''}">${n}</div>
    <div class="m">${meta||''}</div></div>`;
}

function badge(sec){
  return sec && sec.stale
    ? `<span class="badge" title="${esc(sec.stale_reason||'')}">stale · ${ago(sec.fetched_at)}</span>`
    : '';
}

function card(title, caption, sec, body, cls){
  if(sec && sec.stale && !sec.fetched_at){
    body = `<div class="err">No data yet — ${esc(sec.stale_reason||'not fetched')}</div>`;
  }
  return `<section class="card ${cls||''}"><h2>${esc(title)}${badge(sec)}</h2>
    ${caption?`<p class="cap">${esc(caption)}</p>`:''}${body}</section>`;
}

function histTable(series){
  const rows = rangedRows().slice().reverse();
  return `<div class="scroll"><table><thead><tr><th>Date</th>${
    series.map(s=>`<th>${esc(s.label)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr><td>${esc(shortDate(r.date))}</td>${
      series.map(s=>`<td>${nf(r[s.key],2)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}

function render(){
  const d = DATA, S = d.sections || {};
  const dig = (...p) => p.reduce((a,k) => (a && typeof a === 'object') ? a[k] : undefined, S);

  document.getElementById('stamp').textContent = ago(d.generated_at);
  document.getElementById('stamp').title = d.generated_at || '';
  // Count what is actually stale on screen, not what failed on the last run —
  // a partial run (--only) leaves earlier failures untouched and unreported.
  const staleNames = Object.entries(S).filter(([,v]) => v && v.stale).map(([k]) => k);
  const bad = staleNames.length;
  document.getElementById('srcs').innerHTML = bad
    ? `<span style="color:var(--warn)">${bad} source${bad>1?'s':''} stale</span>`
    : 'all sources live';

  // ---- headline tiles
  const n50 = dig('nse_valuation','indices','Nifty 50') || {};
  const fii = dig('nse_fii_dii','flows','fii') || {};
  const dii = dig('nse_fii_dii','flows','dii') || {};
  const us  = dig('us_rates','rates') || {};
  const usv = k => (us[k] && us[k].value != null) ? us[k].value : null;
  const in10 = dig('india_yields','yields','10Y');
  document.getElementById('stats').innerHTML = [
    statTile('Repo rate', nf(dig('rbi','rates','policy_repo_rate')) + '%', 'RBI'),
    statTile('Nifty 50 P/E', nf(n50.pe), dig('nse_valuation','as_of') || ''),
    statTile('Nifty 50', nf(n50.close, 0),
      `${arrow(n50.change_pct)} ${nf(n50.change_pct)}%`, sign(n50.change_pct)),
    statTile('FII net', nf(fii.net, 0), '₹ cr · ' + (fii.date||''), sign(fii.net)),
    statTile('DII net', nf(dii.net, 0), '₹ cr · ' + (dii.date||''), sign(dii.net)),
    statTile('US 10Y', nf(usv('us_10y')) + '%',
      in10 != null ? 'India 10Y ' + nf(in10) + '%' : 'India 10Y –'),
  ].join('');

  // ---- board
  const b = [];
  const pe   = [{key:'nifty_pe',   label:'Nifty 50 P/E', color:cssv('--series-1')}];
  const close= [{key:'nifty_close',label:'Nifty 50',     color:cssv('--series-3')}];
  const usc  = [{key:'us_10y', label:'US 10Y', color:cssv('--series-1')},
                {key:'us_5y',  label:'US 5Y',  color:cssv('--series-2')}];
  const fx   = [{key:'usd_inr', label:'USD/INR', color:cssv('--series-2')}];
  const CTRY = [['us','US'],['de','Germany'],['uk','UK'],
                ['jp','Japan'],['in','India'],['cn','China']];
  const wy = t => CTRY.map(([k,label],i) =>
    ({key:`y${t}_${k}`, label, color:cssv(`--series-${i+1}`)}))
    .filter(s => HIST.some(r => r[s.key] != null));
  const w10 = wy(10), w5 = wy(5);
  const deriv= [{key:'fii_idx_fut_net', label:'FII net idx futures', color:cssv('--series-1')},
                {key:'dii_idx_fut_net', label:'DII net idx futures', color:cssv('--series-2')}];
  const flows= [{key:'fii_net', label:'FII net', color:cssv('--series-1')},
                {key:'dii_net', label:'DII net', color:cssv('--series-2')}];

  b.push(card('Nifty 50 P/E', 'Earnings multiple, from the NSE daily archive. The index sits behind it, dashed, on the right axis — context for the multiple, not a second subject.',
    S.nse_valuation, VIEW==='chart' ? '<div class="chart" data-c="pe"></div>' : histTable(pe)));
  b.push(card('US Treasury yields', 'Two tenors, one scale.', S.us_rates,
    VIEW==='chart' ? '<div class="chart" data-c="us"></div>' : histTable(usc)));
  b.push(card('FII / DII derivatives positioning',
    'Net index-futures open interest, in contracts. This is positioning, not the ' +
    'cash flow on the FII/DII tile — NSE archives this one, so it goes back years.',
    S.fii_derivatives,
    VIEW==='chart' ? '<div class="chart" data-c="deriv"></div>' : histTable(deriv)));
  const wyNote = (S.world_yields && S.world_yields.note) || '';
  b.push(card('Major economies — 10Y government bond yields',
    'Always shows at least 1 year; these move too slowly for a 1M window. ' + wyNote,
    S.world_yields,
    VIEW==='chart' ? '<div class="chart" data-c="w10"></div>' : histTable(w10)));
  b.push(card('Major economies — 5Y government bond yields',
    'US, Germany, UK, Japan and China — no free 5Y series exists for India.',
    S.world_yields,
    VIEW==='chart' ? '<div class="chart" data-c="w5"></div>' : histTable(w5)));
  b.push(card('USD / INR', 'Traded spot. The RBI reference fixing is in the FX table.', S.fx_spot,
    VIEW==='chart' ? '<div class="chart" data-c="fx"></div>' : histTable(fx)));
  b.push(card('Institutional flows', 'Daily net cash-market activity, ₹ crore.',
    S.nse_fii_dii,
    VIEW==='chart' ? '<div class="chart" data-c="flows"></div>' : histTable(flows), 'wide'));

  // ---- index valuation table
  const vi = dig('nse_valuation','indices') || {};
  b.push(card('Index valuation', 'Close, P/E, P/B and dividend yield by index.',
    S.nse_valuation,
    `<div class="scroll"><table><thead><tr><th>Index</th><th>Close</th><th>Chg %</th>
      <th>P/E</th><th>P/B</th><th>Div %</th></tr></thead><tbody>` +
    Object.entries(vi).map(([k,x]) =>
      `<tr><td>${esc(k)}</td><td>${nf(x.close)}</td>
       <td class="${sign(x.change_pct)}">${arrow(x.change_pct)} ${nf(x.change_pct)}</td>
       <td>${nf(x.pe)}</td><td>${nf(x.pb)}</td><td>${nf(x.div_yield)}</td></tr>`).join('') +
    `</tbody></table></div>` +
    (S.nse_valuation && S.nse_valuation.note
      ? `<div class="note">${esc(S.nse_valuation.note)}</div>` : ''), 'wide'));

  // ---- policy rates + FX
  const rr = dig('rbi','rates') || {}, fxr = dig('rbi','fx_reference') || {};
  b.push(card('RBI policy corridor', null, S.rbi,
    `<div class="scroll"><table><tbody>` + [
      ['Policy repo rate', rr.policy_repo_rate], ['Standing deposit facility', rr.standing_deposit_facility],
      ['Marginal standing facility', rr.marginal_standing_facility], ['Bank rate', rr.bank_rate],
      ['Reverse repo (fixed)', rr.reverse_repo_rate], ['CRR', rr.crr], ['SLR', rr.slr],
    ].map(([k,v]) => `<tr><td>${esc(k)}</td><td>${nf(v)}%</td></tr>`).join('') +
    `</tbody></table></div>`));
  b.push(card('RBI reference FX', null, S.rbi,
    `<div class="scroll"><table><tbody>` +
    [['USD',fxr.USD],['EUR',fxr.EUR],['GBP',fxr.GBP],['JPY (per 100)',fxr.JPY_100]]
      .map(([k,v]) => `<tr><td>${esc(k)}</td><td>${nf(v,4)}</td></tr>`).join('') +
    `</tbody></table></div>`));

  // ---- India yields
  const yy = dig('india_yields','yields') || {};
  b.push(card('India G-Sec yields', dig('india_yields','via') || null, S.india_yields,
    `<div class="scroll"><table><tbody>` +
    Object.entries(yy).map(([k,v]) =>
      `<tr><td>India ${esc(k)}</td><td>${nf(v)}%</td></tr>`).join('') +
    `</tbody></table></div>` +
    (dig('india_yields','spread_10y_2y') != null
      ? `<div class="note">10s&ndash;2s spread
         <b>${nf(dig('india_yields','spread_10y_2y'),2)}</b> pts
         &middot; as of ${esc(dig('india_yields','as_of') || '')}
         &middot; ${esc(dig('india_yields','tenors_available') || 0)} tenors published</div>`
      : '') +
    (dig('india_yields','caveat') ? `<div class="note">${esc(dig('india_yields','caveat'))}</div>` : '')));

  // ---- IPOs
  const ip = S.nse_ipo, cur = (ip && ip.current) || [];
  // ---- IPO pipeline: listing today (green), awaiting listing (blue), open now
  const today = (ip && ip.listing_today) || [];
  const soon  = (ip && ip.awaiting) || [];
  const cur2  = (ip && ip.open_now) || cur;
  const tvAll = (ip && ip.tv_watchlist) || [];
  const tvRow = (id, list) => !list.length ? '' :
    `<div class="tvbox"><code id="${id}">${esc(list.join(','))}</code>
      <button class="btn" data-copy="${id}">Copy</button></div>`;

  b.push(card('IPO pipeline', ip && ip.tv_note, ip,
    `<div class="scroll"><table><thead><tr><th>Company</th><th>Ticker</th>
       <th>State</th><th>Series</th><th>Price</th><th>Window</th>
       </tr></thead><tbody>` +
    today.map(x => `<tr class="lists-today"><td>${esc(x.company)}</td>
        <td><b>${esc(x.symbol)}</b></td>
        <td><span class="pill today">Lists today</span></td>
        <td>${esc(x.series)}</td><td>${esc(x.price_range || x.issue_price)}</td>
        <td>${esc(x.listing_date)}</td></tr>`).join('') +
    soon.map(x => {
      // An expected T+3 date is an estimate, and the row says so. Only a real
      // bhavcopy appearance turns a row green.
      const st = x.lists_today_expected ? ['soon','Expected today']
               : x.lists_tomorrow_expected ? ['soon','Lists tomorrow']
               : ['soon','Awaiting listing'];
      const when = x.expected_listing_dmy
        ? `expected <b>${esc(x.expected_listing_dmy)}</b>
           <span style="color:var(--text-muted)">· T+3 est.</span>`
        : `closed ${esc(x.ipo_closed)} (${x.days_since_close}d)`;
      return `<tr class="awaiting"><td>${esc(x.company)}</td>
        <td><b>${esc(x.symbol)}</b></td>
        <td><span class="pill ${st[0]}">${st[1]}</span></td>
        <td>${esc(x.series)}</td><td>${esc(x.price_range || x.issue_price)}</td>
        <td>${when}</td></tr>`;
    }).join('') +
    cur2.map(x => `<tr><td>${esc(x.company)}</td><td><b>${esc(x.symbol)}</b></td>
        <td><span class="pill">${x.live ? 'Open now' : esc(x.status || 'Upcoming')}</span></td>
        <td>${esc(x.series)}</td><td>${esc(x.price)}</td>
        <td>${esc(x.opens)} &rarr; ${esc(x.closes)}</td></tr>`).join('') +
    `</tbody></table></div>` +
    ((today.length || soon.length || cur2.length) ? '' :
      `<div class="note">Nothing in the pipeline right now.</div>`) +
    `<div class="note" style="margin-top:10px"><b>TradingView</b> — all tickers in the pipeline:</div>` +
    tvRow('tv-all', tvAll) +
    (today.length ? `<div class="note" style="margin-top:6px">Listing today only:</div>` +
        tvRow('tv-today', today.map(x => x.tv)) : '') +
    `<div class="note">${ip?esc(ip.past_total):0} past issues in the NSE archive.
      Neither NSE nor Chittorgarh publishes a forward listing date, so the
      expected date is computed from SEBI's T+3 rule &mdash; 83% of 151 past
      listings landed exactly on T+3, ~93% within T+2 to T+6. It is an estimate
      until the stock appears in a bhavcopy, which is what turns a row
      green.</div>`, 'wide'));

  // ---- IPO listing-day gains
  const ig = S.ipo_gains, gl = (ig && ig.listings) || [], gs = ig && ig.stats_last_50;
  const pc = v => v == null ? '–' :
    `<span class="${sign(v)}">${arrow(v)} ${nf(v,1)}%</span>`;
  // Intraday move on listing day: what the open-day buyer made or lost, which
  // is a different question from the allottee's gain off the issue price.
  const oc = x => (x.open && x.close) ? (x.close - x.open) / x.open * 100 : null;
  // The store keeps ISO dates so they sort; display them the way NSE prints them.
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? `${m[3]}-${MON[+m[2]-1]}-${m[1]}` : (s || '–'); };
  b.push(card('IPO listing-day gains',
    'Measured against the issue price. Open = the listing pop; close = holding day one out.',
    ig,
    (gs ? `<div class="stats" style="margin-bottom:11px">
       <div class="stat"><div class="t">Median pop</div>
         <div class="n ${sign(gs.median_open_pct)}">${nf(gs.median_open_pct,1)}%</div>
         <div class="m">last ${gs.count} listings</div></div>
       <div class="stat"><div class="t">Positive on open</div>
         <div class="n">${nf(gs.positive_open_pct,0)}%</div>
         <div class="m">median close ${nf(gs.median_close_pct,1)}%</div></div>
     </div>` : '') +
    `<div class="scroll"><table><thead><tr><th>Company</th>
      <th>Open %</th><th title="Move from the listing open to the listing close">Open&rarr;Close %</th>
      <th>Close %</th><th>Listed</th>
      <th>Issue</th><th>Open</th><th>Close</th>
      </tr></thead><tbody>` +
    gl.slice(0,25).map(x => `<tr>
      <td>${esc(x.company || x.symbol)}<br>
        <span style="color:var(--text-muted);font-size:11px">${esc(x.symbol)}</span></td>
      <td>${pc(x.gain_open_pct)}</td><td>${pc(oc(x))}</td>
      <td>${pc(x.gain_close_pct)}</td>
      <td>${esc(dmy(x.listing_date))}</td><td>${nf(x.issue_price,0)}</td>
      <td>${nf(x.open,1)}</td><td>${nf(x.close,1)}</td></tr>`).join('') +
    `</tbody></table></div>
     <div class="note">${ig ? esc(ig.resolved_total) : 0} listings priced from the
      NSE bhavcopy. ${ig && ig.note ? esc(ig.note) : ''}</div>`, 'wide'));

  // ---- earnings
  const e = S.earnings, ec = (e && e.companies) || {};
  const cr = v => v == null ? '–' : nf(v/1e7, 0);
  b.push(card('Latest quarterly results', 'Revenue and net profit, ₹ crore.', e,
    `<div class="scroll"><table><thead><tr><th>Company</th><th>Quarter</th>
      <th>Revenue</th><th>Net profit</th></tr></thead><tbody>` +
    Object.entries(ec).map(([tk,qs]) => {
      const q = qs[0] || {};
      return `<tr><td>${esc(tk.replace('.NS',''))}</td><td>${esc(q.quarter)}</td>
        <td>${cr(q.revenue)}</td><td>${cr(q.net_income)}</td></tr>`;
    }).join('') + `</tbody></table></div>` +
    (e && e.caveat ? `<div class="note">${esc(e.caveat)}</div>` : ''), 'wide'));

  document.getElementById('board').innerHTML = b.join('');

  if(VIEW === 'chart'){
    const map = {pe, us: usc, fx, flows, deriv, w10, w5};
    const opts = {pe:{dp:2, height:235, context:{key:'nifty_close',
                    label:'Nifty 50', color:cssv('--text-secondary'), dp:0}}, us:{dp:2}, fx:{dp:2}, deriv:{dp:0},
                  w10:{dp:2, minDays:365, height:230},
                  w5:{dp:2, minDays:365, height:230},
                  flows:{dp:0, zeroLine:true, height:210}};
    document.querySelectorAll('.chart').forEach(el =>
      lineChart(el, map[el.dataset.c], opts[el.dataset.c] || {}));
  }

  document.getElementById('foot').innerHTML =
    `Generated ${esc(d.generated_at||'')}. ${HIST.length} rows of history. ` +
    (bad ? 'Stale: ' + staleNames.map(esc).join(', ') + '.'
         : 'All sources fetched cleanly.');
}

/* ------------------------------------------------------------------ boot */
async function load(){
  try{
    const [dRes, hRes] = await Promise.all([
      fetch('data.json?t=' + Date.now(), {cache:'no-store'}),
      fetch('history.json?t=' + Date.now(), {cache:'no-store'}).catch(() => null),
    ]);
    if(!dRes.ok) throw new Error('data.json HTTP ' + dRes.status);
    DATA = await dRes.json();
    HIST = (hRes && hRes.ok) ? ((await hRes.json()).rows || []) : [];
    render();
  }catch(err){
    document.getElementById('board').innerHTML =
      `<section class="card wide"><div class="err">Could not load — ${esc(err.message)}</div></section>`;
  }
}

document.getElementById('range').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  [...e.currentTarget.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
  RANGE = +btn.dataset.d;
  if(DATA) render();
});
const vc = document.getElementById('viewChart'), vt = document.getElementById('viewTable');
vc.addEventListener('click', () => { VIEW='chart'; vc.setAttribute('aria-pressed',true);
  vt.setAttribute('aria-pressed',false); if(DATA) render(); });
vt.addEventListener('click', () => { VIEW='table'; vt.setAttribute('aria-pressed',true);
  vc.setAttribute('aria-pressed',false); if(DATA) render(); });

// Copy the TradingView ticker list. execCommand is the fallback because
// navigator.clipboard needs a secure context, and this page is opened over
// plain http on the LAN as often as over https from Pages.
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const el = document.getElementById(btn.dataset.copy);
  if (!el) return;
  const text = el.textContent.trim();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (__) { ok = false; }
    ta.remove();
  }
  const was = btn.textContent;
  btn.textContent = ok ? 'Copied' : 'Select manually';
  setTimeout(() => { btn.textContent = was; }, 1600);
});

document.getElementById('stamp').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(DATA) render(); }, 160); });
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => { if(DATA) render(); });

load();
</script>
</body>
</html>
